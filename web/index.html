<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spire Agentic GraphRAG</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div>
          <h1 data-i18n="appTitle">Spire Agentic GraphRAG</h1>
          <p data-i18n="appSubtitle">Realtime decision assistant for deck, route, shop, and combat states.</p>
        </div>
        <div class="topbar-actions">
          <label class="language-control">
            <span data-i18n="language">Language</span>
            <select id="languageSelect" aria-label="Language">
              <option value="en">English</option>
              <option value="zh">中文</option>
            </select>
          </label>
          <button id="overlayToggle" type="button" class="secondary-action" data-i18n="overlayMode">Overlay Mode</button>
          <button id="startRun" data-i18n="startRun">Start Demo Run</button>
        </div>
      </section>

      <section class="workspace">
        <aside class="panel">
          <h2 data-i18n="runState">Run State</h2>
          <label><span data-i18n="runId">Run ID</span> <input id="runId" data-i18n-placeholder="runIdPlaceholder" placeholder="run id" /></label>
          <label><span data-i18n="class">Class</span> <input id="characterClass" value="silent" /></label>
          <label><span data-i18n="hp">HP</span> <input id="hp" type="number" value="40" /></label>
          <label><span data-i18n="gold">Gold</span> <input id="gold" type="number" value="120" /></label>
          <label><span data-i18n="deck">Deck</span> <textarea id="deck">Strike
Defend
Deadly Poison
Bouncing Flask</textarea></label>
          <label><span data-i18n="relics">Relics</span> <textarea id="relics">Snecko Skull</textarea></label>
          <button id="syncState" data-i18n="syncState">Sync State</button>
        </aside>

        <section class="panel main-panel">
          <div class="recommendation-header">
            <div>
              <h2 data-i18n="recommendation">Recommendation</h2>
              <p id="status" data-i18n="initialStatus">Create a run, then request a recommendation.</p>
            </div>
            <select id="queryType">
              <option value="card_pick" data-i18n="cardPick">Card Pick</option>
              <option value="relic_pick" data-i18n="relicPick">Relic Pick</option>
              <option value="shop" data-i18n="shop">Shop</option>
              <option value="pathing" data-i18n="pathing">Pathing</option>
              <option value="combat" data-i18n="combat">Combat</option>
            </select>
          </div>

          <div class="live-strip" aria-live="polite">
            <span id="connectionStatus" class="live-pill disconnected">Connecting</span>
            <span><strong data-i18n="decision">Decision</strong> <span id="decisionTypeLabel">card_pick</span></span>
            <span><strong data-i18n="lastUpdated">Updated</strong> <span id="lastUpdated">-</span></span>
          </div>

          <div id="stateSummary" class="state-summary"></div>
          <section id="topRecommendation" class="top-recommendation"></section>
          <div class="manual-controls">
            <label><span data-i18n="options">Options</span> <textarea id="options">Catalyst
Backflip
Dagger Spray</textarea></label>
            <button id="recommend" data-i18n="getRecommendation">Get Recommendation</button>
          </div>

          <div id="answer" class="answer"></div>
          <section id="explanationPanel" class="explanation-panel"></section>
          <div id="scores" class="scores"></div>
          <details>
            <summary data-i18n="graphEvidence">Graph Evidence</summary>
            <pre id="evidence">[]</pre>
          </details>
        </section>
      </section>
    </main>
    <script src="/static/app.js?v=decision-panel-20260529"></script>
  </body>
</html>
